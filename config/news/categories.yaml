# Tried in order on the summary text for 'text:' categories.
keywords:
  - group: noise   # material that follows an event (calls, transcripts, decks) or is routine
    pattern: 'transcript|audio recording|earnings call|con(ference)?[- ]call|investor presentation|analyst|investor(s)? (meet|conference)|plant visit|schedule of'
  - group: usfda
    pattern: 'US ?FDA|warning letter|form 483|import alert|establishment inspection|\bEIR\b|pre-approval inspection'
  - group: regulatory
    pattern: '\bGST\b|income[- ]tax|tax demand|show[- ]cause|penalt|order passed|demand order|assessment order|commissioner|state tax|search (and|&) seizure|enforcement directorate|\bCBI\b|\bSFIO\b|\bNCLT\b|\bNCLAT\b|arbitra|court|tribunal|litigation'
  - group: results
    pattern: 'financial results?|audited results|unaudited|results? for the (quarter|year|period)|quarter(ly)? results'
  - group: order_win
    pattern: '\border(s)? (received|worth|from|of|for|valued)|receipt of (an? )?order|bagg|letter of (award|acceptance|intent)|\bLoA\b|\bLOI\b|work order|purchase order|contract (award|worth|from|for|of)|awarded|lowest bidder|\bL-?1\b'
  - group: mna
    pattern: 'acqui|merger|amalgamat|demerger|stake|joint venture|\bJV\b|divest|scheme of arrangement'
  - group: credit_rating
    pattern: 'credit rating|rating (action|upgrade|downgrade|reaffirm)|\bCRISIL\b|\bICRA\b|\bCARE\b|India Ratings'
  - group: fund_raising
    pattern: '\bQIP\b|preferential|allotment|fund[- ]?rais|rights issue|non-convertible debentures|\bNCDs?\b|commercial paper'
  - group: management
    pattern: 'appoint|resign|cessation|re-designat|chief executive|\bCEO\b|\bCFO\b|managing director|senior management|\bKMP\b'
  - group: business_update
    pattern: 'figures for the month|monthly (sales|business)|sales (figures|volume|numbers)|business update|production,? sales'
  - group: operations
    pattern: 'commission|capacity|plant|commencement|production|launch|operations at|new facility|fire|flood|shutdown'
  - group: noise
    pattern: 'analyst|investor(s)? meet|con(ference)?[- ]call|newspaper|trading window|share certificate|voting results|annual general meeting|\bAGM\b|secretarial compliance|Regulation 74\(5\)|schedule of|postal ballot|e-voting'
